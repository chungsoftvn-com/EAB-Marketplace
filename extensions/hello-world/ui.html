<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World - EAB Extension</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="hw-container">
    <div class="hw-card">
      <div class="hw-header">
        <span class="hw-emoji">👋</span>
        <div>
          <h1 class="hw-title">Hello World Extension</h1>
          <p class="hw-subtitle">Minimal reference extension for EVE Asset Builder (EAB Tools)</p>
        </div>
      </div>

      <div class="hw-info-grid">
        <div class="hw-info-item">
          <span class="hw-label">EAB API Version</span>
          <strong id="hw-api-ver">—</strong>
        </div>
        <div class="hw-info-item">
          <span class="hw-label">Host Theme</span>
          <strong id="hw-theme">—</strong>
        </div>
        <div class="hw-info-item hw-span-2">
          <span class="hw-label">Working Directory</span>
          <code id="hw-workdir">—</code>
        </div>
      </div>

      <div class="hw-actions">
        <input id="hw-name-input" class="form-control form-control-sm" type="text" placeholder="Enter your name..." value="EAB Developer">
        <button id="hw-greet-btn" class="btn btn-primary btn-sm">Say Hello</button>
        <button id="hw-pick-btn" class="btn btn-secondary btn-sm">Pick a File…</button>
      </div>

      <div id="hw-output" class="hw-output">
        Click <strong>Say Hello</strong> or <strong>Pick a File…</strong> to test the EAB host bridge.
      </div>
    </div>
  </div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="ui.js"></script>
</body>
</html>
